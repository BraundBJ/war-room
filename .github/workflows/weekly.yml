name: Weekly War Room update

on:
  schedule:
    - cron: "17 14 * * 2"   # every Tuesday 14:17 UTC (10:17 am Eastern during the season)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      week:
        description: "Force a week (leave blank to use the latest completed week)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # NFL history (1999-2025) never changes, so keep it between runs; 2026 files always re-download
      - uses: actions/cache@v4
        with:
          path: work/stats/raw
          key: nfl-raw-v1
      - name: Build
        env:
          WR_ROOT: ${{ github.workspace }}/work
          WR_WEEK: ${{ inputs.week }}
        run: ./run.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
